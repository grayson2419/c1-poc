name: Vuln Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep 'skills/.*-metadata\.json' || true)
          if [ -z "$FILES" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "$FILES" > /tmp/changed-skills.txt
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment (vulnerable)
        if: steps.changed.outputs.any == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const files = fs.readFileSync('/tmp/changed-skills.txt', 'utf8')
              .trim().split('\n').filter(Boolean);

            const skills = files.map(f => {
              try { return JSON.parse(fs.readFileSync(f, 'utf8')); }
              catch { return null; }
            }).filter(Boolean);

            const rows = skills.map(s => {
              const guard = s.agentguard_report_url
                ? `[View report](${s.agentguard_report_url})`
                : '⏳ pending';
              return [
                `**[${s.name}](${s.github_url})**`,
                (s.category ?? []).join(', '),
                s.description,
                guard,
              ].join(' | ');
            });

            const body = [
              '## Skill Enrichment Preview',
              '',
              'Skill | Category | Description | AgentGuard',
              '------|----------|-------------|----------',
              ...rows,
            ].join('\n');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
